[project]
name = "research-track"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "federico-romairone", email = "federico.romairone.cs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.scripts]
research-track = "research_track:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
]
